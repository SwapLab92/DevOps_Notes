>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> Persistent Volume<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

apiVersion: v1                  # Core Kubernetes API
kind: PersistentVolume          # We are creating a PV

metadata:
  name: nginx-pv                # Name of the PV

spec:

  capacity:
    storage: 1Gi                # Total storage available

  accessModes:
  - ReadWriteOnce               # One node can read/write

  persistentVolumeReclaimPolicy: Retain
                                # Keep data even if PVC is deleted

  hostPath:
    path: /data/nginx           # Actual storage on host machine
-----------------------------------------------------------------------------------------------
>>>>>>>>>>>>>>>>>>>>>>>>>>>>>Persistent Vloume Claim<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

apiVersion: v1                    # Core Kubernetes API
kind: PersistentVolumeClaim       # We are creating a PVC

metadata:
  name: nginx-pvc                 # Name of PVC

spec:
  storageClassName: ""        # Disable dynamic provisioning
  volumeClaim: nginx-pv

  accessModes:
  - ReadWriteOnce                 # Must match PV access mode

  resources:
    requests:
      storage: 500Mi              # Request 500MB storage
