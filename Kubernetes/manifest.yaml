>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> Persistent Volume<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

apiVersion: v1                  # Core Kubernetes API
kind: PersistentVolume          # We are creating a PV

metadata:
  name: nginx-pv                # Name of the PV

spec:

  capacity:
    storage: 1Gi                # Total storage available

  accessModes:
  - ReadWriteOnce               # One node can read/write

  persistentVolumeReclaimPolicy: Retain
                                # Keep data even if PVC is deleted

  hostPath:
    path: /data/nginx           # Actual storage on host machine
