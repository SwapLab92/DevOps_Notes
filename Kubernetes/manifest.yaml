>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>ingress.yaml Deployment <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

apiVersion: networking.k8s.io/v1      # API version used for Ingress resources

kind: Ingress                         # Create an Ingress object

metadata:

  name: devops-ingress                # Name of the Ingress resource

  annotations:

    nginx.ingress.kubernetes.io/rewrite-target: /
                                       # When user accesses /jenkins or /grafana,
                                       # rewrite the URL to "/" before sending
                                       # it to the backend application.
                                       # Prevents 404 errors from nginx.

spec:

  ingressClassName: nginx             # Use NGINX Ingress Controller
                                      # to process this Ingress resource

  rules:                              # Traffic routing rules start here

  - http:                             # HTTP-based routing

      paths:                          # List of URL paths to match

      - path: /jenkins                # If request URL contains /jenkins

        pathType: Prefix              # Match anything starting with /jenkins
                                      # Example:
                                      # /jenkins
                                      # /jenkins/login
                                      # /jenkins/admin

        backend:                      # Destination service details

          service:

            name: jenkins            # Forward traffic to jenkins service

            port:

              number: 80             # Service listens on port 80

      - path: /grafana               # If request URL contains /grafana

        pathType: Prefix             # Match all URLs beginning with /grafana

        backend:                     # Destination service details

          service:

            name: grafana            # Forward traffic to grafana service

            port:

              number: 80             # Service listens on port 80
