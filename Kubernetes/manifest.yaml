>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> grafana yaml Deployment <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

apiVersion: apps/v1               # Deployment API version

kind: Deployment                  # Create a Deployment resource

metadata:

  name: grafana                   # Deployment name

spec:

  replicas: 1                     # Run one Pod

  selector:                       # Deployment uses labels to manage Pods

    matchLabels:

      app: grafana                # Select Pods with app=grafana

  template:                       # Pod template

    metadata:

      labels:

        app: grafana              # Label assigned to created Pods

    spec:

      containers:                 # Container definition

      - name: web                 # Container name

        image: nginx              # Use nginx image

        command:                  # Override nginx default startup

        - /bin/sh                 # Start shell

        - -c                      # Execute command string

        - |

          echo "<h1>Welcome to Grafana</h1>" > /usr/share/nginx/html/index.html
                                  # Create custom web page

          nginx -g 'daemon off;'
                                  # Run nginx in foreground
                                  # Keeps container alive

