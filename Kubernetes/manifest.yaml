>>>>>>>>>>>>>>>>>>>>>>>>>>>>>jenkins.yaml Deployment<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<
apiVersion: apps/v1               # Deployment API version

kind: Deployment                  # Create a Deployment resource

metadata:

  name: jenkins                   # Deployment name

spec:

  replicas: 1                     # Number of Pod replicas to run

  selector:                       # Used by Deployment to identify its Pods

    matchLabels:

      app: jenkins                # Look for Pods having label app=jenkins

  template:                       # Blueprint for creating Pods

    metadata:

      labels:

        app: jenkins              # Label assigned to Pods

    spec:

      containers:                 # List of containers inside the Pod

      - name: web                 # Container name

        image: nginx              # Use official nginx image

        command:                  # Override default nginx startup command

        - /bin/sh                 # Launch shell

        - -c                      # Execute the following command string

        - |

          echo "<h1>Welcome to Jenkins</h1>" > /usr/share/nginx/html/index.html
                                  # Create custom web page

          nginx -g 'daemon off;'
                                  # Start nginx in foreground
                                  # Container exits if main process stops
