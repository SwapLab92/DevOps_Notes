Multi-Container Yaml 


apiVersion: v1
kind: Pod
metadata:
  name: my-pod1
spec:
  containers:
    - name: container1
      image: nginx
    - name: container2
      image: nginx

How to run yaml file

>>> sudo kubectl apply -f myfile.yaml
==========================================================================================
>>>>>>>>>>>>>>>>>>>>Deployment Manifest<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-demo

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-demo

  template:
    metadata:
      labels:
        app: nginx-demo

    spec:
      containers:
      - name: nginx
        image: nginx:1.24

=========================================================================================================
>>>>>>>>>>>>>>>>>>>>>> AUTOSCALING YAML<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

apiVersion: apps/v1
kind: Deployment

metadata:
  labels:
    app: cpu-demo1
  name: cpu-demo1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cpu-demo1

  template:
    metadata:
      labels:
        app: cpu-demo1

    spec:
      containers:
        - image: busybox
          name: busybox

          command:
            - /bin/sh
            - -c

          args:
            - while true; do :; done

          resources:
            requests:
              cpu: 100m

            limits:
              cpu: 200m

